<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tha Raq Life</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>THA RAQ LIFE</h1>
    <p>Official Community Store</p>
    <button id="cart-toggle" class="cart-toggle">🛒 Cart (<span id="cart-count">0</span>)</button>
</header>

<section class="shop">
    <div class="card">
        <h2>Custom Name</h2>
        <p>Create your own in-game custom name.</p>
        <div class="price">$10</div>
        <button class="buy" onclick="addToCart(1, 'Custom Name', 10)">Buy Now</button>
    </div>

    <div class="card">
        <h2>Custom Gun</h2>
        <p>Request a custom weapon design.</p>
        <div class="price">$10</div>
        <button class="buy" onclick="addToCart(2, 'Custom Gun', 10)">Buy Now</button>
    </div>
</section>

<!-- Cart Sidebar -->
<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-content">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button id="close-cart" class="close-btn">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
            <p class="empty-cart">Your cart is empty</p>
        </div>
        <div class="cart-footer">
            <div class="total-section">
                <strong>Total: $<span id="total-price">0.00</span></strong>
            </div>
            <button class="checkout-btn" onclick="goToCheckout()">Proceed to Checkout</button>
            <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
        </div>
    </div>
</div>

<!-- Overlay for modals -->
<div id="modal-overlay" class="modal-overlay"></div>

<footer>
    © 2026 Tha Raq Life
</footer>

<script src="script.js"></script>
</body>
</html>
