<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tha Raq Life</title>
<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f0f0f;
    color:white;
}
header{
    background:#8b0000;
    text-align:center;
    padding:60px 20px;
}
h1{
    font-size:3rem;
}
.shop{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    padding:40px;
}
.card{
    background:#1c1c1c;
    width:300px;
    padding:20px;
    border-radius:10px;
    text-align:center;
}
.price{
    color:#00ff66;
    font-size:2rem;
}
.buy{
    display:inline-block;
    padding:10px 20px;
    background:red;
    color:white;
    text-decoration:none;
    border-radius:5px;
}
footer{
    text-align:center;
    padding:20px;
    background:black;
}
</style>
</head>
<body>

<header>
    <h1>THA RAQ LIFE</h1>
    <p>Official Community Store</p>
</header>

<section class="shop">
    <div class="card">
        <h2>Custom Name</h2>
        <p>Create your own in-game custom name.</p>
        <div class="price">$10</div>
        <a href="#" class="buy">Buy Now</a>
    </div>

    <div class="card">
        <h2>Custom Gun</h2>
        <p>Request a custom weapon design.</p>
        <div class="price">$10</div>
        <a href="#" class="buy">Buy Now</a>
    </div>
</section>

<footer>
    © 2026 Tha Raq Life
</footer>

</body>
</html>
