<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tha Raq Life</title>
<link rel="stylesheet" href="styles.css">
<!-- Stripe.js -->
<script src="https://js.stripe.com/v3/"></script>
</head>
<body>

<header>
    <h1>THA RAQ LIFE</h1>
    <p>Official Community Store</p>
    <button id="cart-toggle" class="cart-toggle">🛒 Cart (<span id="cart-count">0</span>)</button>
</header>

<section class="shop">
    <div class="card">
        <h2>Custom Name</h2>
        <p>Create your own in-game custom name.</p>
        <div class="price">$10</div>
        <button class="buy" onclick="addToCart('Custom Name', 10)">Add to Cart</button>
    </div>

    <div class="card">
        <h2>Custom Gun</h2>
        <p>Request a custom weapon design.</p>
        <div class="price">$10</div>
        <button class="buy" onclick="addToCart('Custom Gun', 10)">Add to Cart</button>
    </div>
</section>

<!-- Cart Sidebar -->
<div id="cart-sidebar" class="cart-sidebar">
    <div class="cart-content">
        <div class="cart-header">
            <h2>Shopping Cart</h2>
            <button id="close-cart" class="close-btn">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
            <p class="empty-cart">Your cart is empty</p>
        </div>
        <div class="cart-footer">
            <div class="total-section">
                <strong>Total: $<span id="total-price">0.00</span></strong>
            </div>
            <button class="checkout-btn" onclick="openCheckout()">Checkout</button>
            <button class="clear-btn" onclick="clearCart()">Clear Cart</button>
        </div>
    </div>
</div>

<!-- Checkout Modal -->
<div id="checkout-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Checkout</h2>
            <button class="close-modal" onclick="closeCheckout()">&times;</button>
        </div>
        
        <div class="order-summary">
            <h3>Order Summary</h3>
            <div id="order-items"></div>
            <div class="order-total">
                <strong>Total: $<span id="checkout-total">0.00</span></strong>
            </div>
        </div>

        <form id="payment-form" class="payment-form">
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required>
            </div>

            <!-- Stripe Payment Element -->
            <div id="payment-element"></div>

            <button id="submit-btn" type="submit" class="pay-btn">Pay Now</button>
            <div id="payment-message" class="payment-message"></div>
        </form>
    </div>
</div>

<!-- Overlay for modals -->
<div id="modal-overlay" class="modal-overlay"></div>

<footer>
    © 2026 Tha Raq Life
</footer>

<script src="script.js"></script>
</body>
</html>
